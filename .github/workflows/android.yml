name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Restore Stable Debug Keystore
      run: |
        set -e
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "ERROR: Stable debug keystore is missing."
          exit 1
        fi
        mkdir -p "$HOME/.android"
        cp debug.keystore "$HOME/.android/debug.keystore"
        test -s "$HOME/.android/debug.keystore"
        keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

    - name: Restore Environment
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        elif [ ! -f .env ]; then
          touch .env
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Verify Gradle version
      run: gradle --version

    - name: Prepare Gradle Wrapper
      run: chmod +x gradlew

    - name: Apply Unified RTL Input Behavior
      shell: bash
      run: |
        set -e
        mkdir -p app/src/main/java/com/example/ui/screens
        cat > app/src/main/java/com/example/ui/screens/UnifiedOutlinedTextField.kt <<'KOTLIN'
package com.example.ui.screens

import androidx.compose.foundation.layout.PaddingValues
import androidx.compose.foundation.layout.heightIn
import androidx.compose.foundation.text.KeyboardActions
import androidx.compose.foundation.text.KeyboardOptions
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.focus.onFocusChanged
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.TextRange
import androidx.compose.ui.text.TextStyle
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.text.input.TextFieldValue
import androidx.compose.ui.text.input.VisualTransformation
import androidx.compose.ui.text.style.TextAlign
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import androidx.compose.ui.graphics.Shape
import androidx.compose.foundation.interaction.MutableInteractionSource
import androidx.compose.ui.platform.LocalLayoutDirection
import androidx.compose.ui.unit.LayoutDirection
import androidx.compose.runtime.CompositionLocalProvider

@Composable
fun UnifiedOutlinedTextField(
    value: String,
    onValueChange: (String) -> Unit,
    modifier: Modifier = Modifier,
    enabled: Boolean = true,
    readOnly: Boolean = false,
    textStyle: TextStyle = LocalTextStyle.current,
    label: (@Composable () -> Unit)? = null,
    placeholder: (@Composable () -> Unit)? = null,
    leadingIcon: (@Composable () -> Unit)? = null,
    trailingIcon: (@Composable () -> Unit)? = null,
    prefix: (@Composable () -> Unit)? = null,
    suffix: (@Composable () -> Unit)? = null,
    supportingText: (@Composable () -> Unit)? = null,
    isError: Boolean = false,
    visualTransformation: VisualTransformation = VisualTransformation.None,
    keyboardOptions: KeyboardOptions = KeyboardOptions.Default,
    keyboardActions: KeyboardActions = KeyboardActions.Default,
    singleLine: Boolean = false,
    maxLines: Int = if (singleLine) 1 else Int.MAX_VALUE,
    minLines: Int = 1,
    interactionSource: MutableInteractionSource? = null,
    shape: Shape = androidx.compose.foundation.shape.RoundedCornerShape(6.dp),
    colors: TextFieldColors = OutlinedTextFieldDefaults.colors(
        focusedTextColor = Color.Black,
        unfocusedTextColor = Color.Black,
        focusedBorderColor = Color(0xFF0E6B38),
        unfocusedBorderColor = Color(0xFFD5DAD7),
        cursorColor = Color(0xFF0E6B38)
    ),
    contentPadding: PaddingValues = OutlinedTextFieldDefaults.contentPaddingWithoutLabel(
        start = 10.dp, top = 6.dp, end = 10.dp, bottom = 6.dp
    )
) {
    var fieldValue by remember(value) {
        mutableStateOf(TextFieldValue(value))
    }

    val unifiedStyle = textStyle.merge(
        TextStyle(
            fontSize = 14.sp,
            fontWeight = FontWeight.Bold,
            textAlign = TextAlign.Center
        )
    )

    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
        OutlinedTextField(
            value = fieldValue,
            onValueChange = {
                fieldValue = it
                onValueChange(it.text)
            },
            modifier = modifier
                .heightIn(min = 48.dp)
                .onFocusChanged { focus ->
                    if (focus.isFocused && fieldValue.text.isNotEmpty()) {
                        fieldValue = fieldValue.copy(
                            selection = TextRange(0, fieldValue.text.length)
                        )
                    }
                },
            enabled = enabled,
            readOnly = readOnly,
            textStyle = unifiedStyle,
            label = label,
            placeholder = placeholder,
            leadingIcon = leadingIcon,
            trailingIcon = trailingIcon,
            prefix = prefix,
            suffix = suffix,
            supportingText = supportingText,
            isError = isError,
            visualTransformation = visualTransformation,
            keyboardOptions = keyboardOptions,
            keyboardActions = keyboardActions,
            singleLine = singleLine,
            maxLines = maxLines,
            minLines = minLines,
            interactionSource = interactionSource,
            shape = shape,
            colors = colors,
            contentPadding = contentPadding
        )
    }
}
KOTLIN

        python3 - <<'PY'
from pathlib import Path
root = Path('app/src/main/java/com/example/ui/screens')
helper = root / 'UnifiedOutlinedTextField.kt'
for path in root.glob('*.kt'):
    if path.name == helper.name:
        continue
    text = path.read_text(encoding='utf-8')
    updated = text.replace('OutlinedTextField(', 'UnifiedOutlinedTextField(')
    if updated != text:
        path.write_text(updated, encoding='utf-8')
PY

        echo "Unified RTL input behavior applied to all screen Kotlin files."

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

    - name: Verify APK output and signing
      run: |
        set -e
        APK_DIR="app/build/outputs/apk/debug"
        APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)
        if [ -z "$APK" ]; then
          echo "ERROR: No APK was generated in $APK_DIR"
          exit 1
        fi
        echo "APK generated: $APK"
        ls -lh "$APK"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        "$APKSIGNER" verify --verbose --print-certs "$APK"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Al-Ezzi-Grocery-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
