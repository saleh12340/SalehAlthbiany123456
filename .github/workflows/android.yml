name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Platforms
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

    - name: Restore Keystore & Environment Secrets
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored successfully"
        fi
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
          echo ".env created from .env.example"
        elif [ ! -f .env ]; then
          touch .env
          echo "empty .env created"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        cache-read-only: false

    - name: Generate Wrapper & Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.11.1 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Al-Ezzi-Grocery-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
