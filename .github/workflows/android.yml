name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Restore Keystore & Environment Secrets
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore restored successfully"
        fi
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
          echo ".env created from .env.example"
        elif [ ! -f .env ]; then
          touch .env
          echo "empty .env created"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Verify Gradle version
      run: gradle --version

    - name: Prepare Gradle Wrapper
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

    - name: Verify APK output
      run: |
        set -e
        APK_DIR="app/build/outputs/apk/debug"
        APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "ERROR: No APK was generated in $APK_DIR"
          exit 1
        fi
        echo "APK files generated:"
        find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Al-Ezzi-Grocery-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
