name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Restore Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; elif [ ! -f .env ]; then touch .env; fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare Gradle Wrapper
        run: chmod +x gradlew
      - name: Apply unified Arabic UI and RTL layout
        run: python3 scripts/apply_ui_layout.py
      - name: Apply WhatsApp image and customer linking share patch
        run: python3 scripts/apply_sharing_patch.py
      - name: Apply business invoice and purchase workflow fixes
        run: python3 scripts/apply_business_features.py
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
      - name: Verify APK output
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK generated: $APK"
          ls -lh "$APK"
      - name: Verify APK signing
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ezzi-Grocery-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
